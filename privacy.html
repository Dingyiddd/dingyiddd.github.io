  <h1>隐私说明</h1>
  <p>这是 Dingyiddd 自用的 Linux 与 Google Drive 文件同步配置。</p>
  <p>获得本人 Google 账号授权后，rclone 会访问 Google Drive 中的文件及文件信息，以便与本人指定的本地文件夹双向同步。同步可能上传、下载、修改或删除对应文件。</p>
  <p>OAuth 凭据保存在本人电脑上。本项目的网站不收集或保存 Google Drive 文件及 OAuth 凭据。</p>
  <p>本人可以随时在 Google 账号的第三方应用授权设置中撤销访问权限。</p>
  <p>如需联系维护者，请访问 <a href="https://github.com/Dingyiddd">GitHub 主页</a>。</p>
